name: Product CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for Product API
        run: |
          for i in {1..20}; do
            if curl -f http://127.0.0.1:3000/health; then
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          cat app.log
          exit 1

      - name: Test health endpoint
        run: curl -f http://127.0.0.1:3000/health

      - name: Test Product API
        run: curl -f http://127.0.0.1:3000/api/products