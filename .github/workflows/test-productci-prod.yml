name: Product CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================
  # CI
  # =========================
  ci:
    name: CI - Test Product API
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest

        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Start Product API
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid


      # =========================
      # HEALTHCHECK
      # =========================
      - name: Healthcheck Product API
        run: |
          echo "Waiting for Product API..."

          for i in {1..30}; do

            if curl -fsS http://127.0.0.1:3000/health; then
              echo ""
              echo "Product API is healthy"
              exit 0
            fi

            echo "Attempt $i: API is not healthy yet"
            sleep 2
          done

          echo "Product API healthcheck failed"
          cat app.log
          exit 1


      # =========================
      # CREATE
      # =========================
      - name: Test CREATE Product
        run: |
          RESPONSE=$(curl -fsS \
            -X POST http://127.0.0.1:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{
              "pid": "CI001",
              "pname": "CI Product",
              "price": 1000000,
              "quantity": 10
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | node -e "
            let data = '';

            process.stdin.on('data', chunk => data += chunk);

            process.stdin.on('end', () => {
              const result = JSON.parse(data);

              if (!result.product) {
                console.error('CREATE failed');
                process.exit(1);
              }

              if (result.product.pid !== 'CI001') {
                console.error('Incorrect pid');
                process.exit(1);
              }

              console.log('CREATE passed');
            });
          "


      # =========================
      # READ
      # =========================
      - name: Test READ Product
        run: |
          RESPONSE=$(curl -fsS \
            http://127.0.0.1:3000/api/products/CI001)

          echo "$RESPONSE"

          echo "$RESPONSE" | node -e "
            let data = '';

            process.stdin.on('data', chunk => data += chunk);

            process.stdin.on('end', () => {
              const product = JSON.parse(data);

              if (product.pid !== 'CI001') {
                console.error('READ failed');
                process.exit(1);
              }

              console.log('READ passed');
            });
          "


      # =========================
      # UPDATE
      # =========================
      - name: Test UPDATE Product
        run: |
          RESPONSE=$(curl -fsS \
            -X PUT http://127.0.0.1:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{
              "pname": "CI Product Updated",
              "price": 2000000,
              "quantity": 20
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | node -e "
            let data = '';

            process.stdin.on('data', chunk => data += chunk);

            process.stdin.on('end', () => {
              const result = JSON.parse(data);

              if (!result.product) {
                console.error('UPDATE failed');
                process.exit(1);
              }

              if (result.product.pname !== 'CI Product Updated') {
                console.error('Incorrect pname');
                process.exit(1);
              }

              if (result.product.price !== 2000000) {
                console.error('Incorrect price');
                process.exit(1);
              }

              if (result.product.quantity !== 20) {
                console.error('Incorrect quantity');
                process.exit(1);
              }

              console.log('UPDATE passed');
            });
          "


      # =========================
      # DELETE
      # =========================
      - name: Test DELETE Product
        run: |
          RESPONSE=$(curl -fsS \
            -X DELETE http://127.0.0.1:3000/api/products/CI001)

          echo "$RESPONSE"

          echo "$RESPONSE" | node -e "
            let data = '';

            process.stdin.on('data', chunk => data += chunk);

            process.stdin.on('end', () => {
              const result = JSON.parse(data);

              if (result.message !== 'Product deleted successfully') {
                console.error('DELETE failed');
                process.exit(1);
              }

              console.log('DELETE passed');
            });
          "


      # =========================
      # VERIFY DELETE
      # =========================
      - name: Verify Product Deleted
        run: |
          STATUS=$(curl \
            -s \
            -o response.json \
            -w "%{http_code}" \
            http://127.0.0.1:3000/api/products/CI001)

          cat response.json

          if [ "$STATUS" != "404" ]; then
            echo "Expected HTTP 404 but received $STATUS"
            exit 1
          fi

          echo "DELETE verification passed"


      - name: Show API logs on failure
        if: failure()
        run: |
          echo "===== PRODUCT API LOG ====="
          cat app.log || true


  # =========================
  # CD
  # =========================
  cd:
    name: CD - Push Docker Image

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/product-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-


      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


      - name: Deployment completed
        run: |
          echo "Docker image pushed successfully"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest"